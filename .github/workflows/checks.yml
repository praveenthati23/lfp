name: Pull Request Checks

on:
  pull_request:
    branches:
      - playlist_reorder

permissions:
  id-token: write
  security-events: write
  contents: read
  actions: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - uses: actions/checkout@v3

      # Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache the local Maven repository to speed up builds
      - name: Cache local Maven repository
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build and install the project using Maven
      - name: Build and Install with Maven
        run: mvn clean install -U $MVN_OPS

      # Uncomment the following steps to re-enable testing and code quality checks

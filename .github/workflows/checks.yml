name: Maven Build and Test

on:
  pull_request:
    branches:
      - playlist_reorder  # Trigger the workflow on pull requests to the playlist_reorder branch

permissions:
  id-token: write  # Required for requesting the JWT
  security-events: write
  contents: read
  actions: read  # Required for actions/checkout
  issues: write
  pull-requests: write
  checks: write  # Needed for SpotBugs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3  # Check out the repository

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven Dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Analyze with SpotBugs, PMD, and Checkstyle
        run: mvn verify spotbugs:spotbugs pmd:pmd

      - name: SpotBugs Report
        uses: jwgmeligmeyling/spotbugs-github-action@master
        with:
          path: "**/spotbugsXml.xml"

      - name: PMD Report
        uses: jwgmeligmeyling/pmd-github-action@master
        with:
          path: "**/pmd.xml"

      - name: Generate Code Coverage Report
        run: mvn jacoco:report

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          generate-coverage-badge: true
          coverage-badge-filename: jacoco.svg
          generate-summary: false
          summary-filename: coverage-summary.json
          workflow-summary-heading: JaCoCo Test Coverage Summary

name: Pull Request Checks

on:
  pull_request:
    branches:
      - playlist_reorder


permissions:
  id-token: write
  security-events: write
  contents: read
  actions: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - uses: actions/checkout@v3

      # Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache Maven dependencies to speed up builds
      - name: Cache local Maven repository
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Run tests with Maven
      - name: Run tests
        run: mvn $MVN_OPS test

      # Run SpotBugs, PMD, and Checkstyle
      - name: Run SpotBugs, PMD, and Checkstyle
        run: mvn $MVN_OPS -B verify spotbugs:spotbugs pmd:pmd

      # Generate SpotBugs report
      - uses: jwgmeligmeyling/spotbugs-github-action@master
        with:
          path: '**/spotbugsXml.xml'

      # Generate PMD report
      - uses: jwgmeligmeyling/pmd-github-action@master
        with:
          path: '**/pmd.xml'

      # Generate code coverage report with JaCoCo
      - name: Generate code coverage
        run: mvn jacoco:report

      # Generate JaCoCo Badge
      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          generate-coverage-badge: true
          coverage-badge-filename: jacoco.svg
          generate-summary: false
          summary-filename: coverage-summary.json
          workflow-summary-heading: JaCoCo Test Coverage Summary

      # Upload code coverage badge to GitHub
      - name: Upload JaCoCo Badge
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-badge
          path: jacoco.svg

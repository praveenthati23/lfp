server:
  port : 9061
  servlet:
    context-path: /core
  forward-headers-strategy: framework

spring:
  datasource:
    username: ${POSTGRES_USERNAME:admin}
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/lastfarewells}
    password: ${POSTGRES_PASSWORD:admin}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: auto
        integration:
          envers:
            enabled: true
            
storj:
 bucketName : <bucketName>
 accessKeyId : <accessKeyId>
 secretKey : <secretekey>
 region : <region>
 endpointUrl : https://gateway.storjshare.io
 upload.duration : 1
 download.duration : 2

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:9090}
  credentials:
    secret: ${KEYCLOAK_SECRET:R0bxZRl1pRTK25W4CEd2Wb3Teanr1BEN}
  realm: lastfarewells
  bearer-only: true
  use-resource-role-mappings: true
  ssl-required: external
  resource: lastfarewells-admin
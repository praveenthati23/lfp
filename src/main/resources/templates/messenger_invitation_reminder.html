<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding: 10px 0;
        }
        .content {
            margin: 20px 0;
        }
        .invite-button {
            display: inline-block;
            background-color: #6366f1;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 5px;
           
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p th:text="'Dear, ' + ${messenger} + '!'"></p><br>
    <p th:text="'We\'re following up on your invitation to become a Messenger for ' + ${userName} + ' on Last Farewells. Your confirmation is vital for the completion of their account setup and we\'re yet to receive it.'"></p><br>


      <a th:href="@{|https://lastfarewells.vercel.app/messengers/${token}|}" class="invite-button">CONFIRM MESSENGER INVITATION</a><br>

    <p th:text="'Please let us know your decision by ' + ${date} + '. It\'s important for '  + ${userName} +' to have their Messenger in place. If we don\'t receive a response by the specified date, we will inform '  + ${userName} + ' that you are not available to accept this role.'"></p>

    <p>Should you have any questions or need more information, our Messenger FAQ page is here to help, or feel free to contact our support team.</p>

    <p>We appreciate your prompt attention to this request</p><br>


    <p>Thank you,</p>
    <p>The Last Farewells Team</p>

</body>
</html>

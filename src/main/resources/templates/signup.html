<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>


    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding: 10px 0;
        }
        .content {
            margin: 20px 0;
        }
        .verify-button {
            display: inline-block;
            background-color: #6366f1;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
           
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p th:text="'Hello ' + ${userName} + ','"></p><br>
    <p>Welcome to Last Farewells! In order to start using the system we ask that you please verify your Last Farewells account by clicking the button below:
</p><br>
  

     <a th:href="@{|${appUrl}signup/${token}|}" class="verify-button">Verify Email</a> <br>

    
    
    <p>We are excited to have you get started and ensure that no words are left unspoken.</p>
    <p>Regards,</p>
    <p>The Last Farewells Team</p>
    
</body>
</html>

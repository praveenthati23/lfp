<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding: 10px 0;
        }
        .content {
            margin: 20px 0;
        }
        .reset-button {
            display: inline-block;
            background-color: #6366f1;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
           
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-top: 20px;
        }
    </style>
<body>

   

    <p th:text="'Your account at Last Farewells has requested to reset your password'"></p>
    <p>To reset your password please verify below.</p>
  
    <a th:href="@{|${appUrl}reset-password/${token}|}" class="reset-button">RESET</a>
    
    <p>Reset Password.</p>
    <p>Regards,</p>
    <p>The Last Farewells Team</p>
    
</body>
</html>
